openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: chat
    description: Socratic math tutor chat
  - name: parent
    description: Parent dashboard analytics, history, and strategy AI
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Log in to an existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{vidyaId}:
    get:
      operationId: getProfile
      tags: [auth]
      summary: Get user profile
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update user profile
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{vidyaId}/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change user password
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{vidyaId}/linked-students:
    get:
      operationId: getLinkedStudents
      tags: [auth]
      summary: Get students linked to a parent
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Linked students list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedStudentsResponse"
        "404":
          description: Parent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{vidyaId}/link-student:
    post:
      operationId: linkStudent
      tags: [auth]
      summary: Link a student to a parent account
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkStudentInput"
      responses:
        "200":
          description: Student linked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedStudentProfile"
        "400":
          description: Invalid input or already linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{vidyaId}/link-student/{studentVidyaId}:
    delete:
      operationId: unlinkStudent
      tags: [auth]
      summary: Unlink a student from a parent account
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
        - in: path
          name: studentVidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student unlinked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/message:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the Socratic math tutor (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: SSE stream of tutor response chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset link sent (mock)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: No matching account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parent/{vidyaId}/students/{studentVidyaId}/analytics:
    get:
      operationId: getStudentAnalytics
      tags: [parent]
      summary: Per-topic practice analytics for a linked student
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
        - in: path
          name: studentVidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAnalytics"
        "403":
          description: Student not linked to this parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parent/{vidyaId}/students/{studentVidyaId}/history:
    get:
      operationId: getStudentHistory
      tags: [parent]
      summary: Saved Socratic chat history for a linked student
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
        - in: path
          name: studentVidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student chat history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentHistoryResponse"
        "403":
          description: Student not linked to this parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parent/{vidyaId}/consultant/messages:
    get:
      operationId: getConsultantHistory
      tags: [parent]
      summary: Load the parent's saved strategy-AI conversation
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved consultant messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantHistoryResponse"

  /parent/{vidyaId}/consultant/message:
    post:
      operationId: sendConsultantMessage
      tags: [parent]
      summary: Ask the parent strategy AI (SSE stream)
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultantMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parent/{vidyaId}/consultant/transcribe:
    post:
      operationId: transcribeConsultantAudio
      tags: [parent]
      summary: Transcribe recorded parent audio to text
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultantAudioInput"
      responses:
        "200":
          description: Transcribed text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserRegistrationInput:
      type: object
      required: [name, password, role, gender]
      properties:
        name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [student, parent]
        gender:
          type: string
          enum: [male, female]
        studentClass:
          type: ["string", "null"]
          enum: ["4", "5", "6", "7", null]
        board:
          type: ["string", "null"]
        parentType:
          type: ["string", "null"]
          enum: [father, mother, null]
        contact:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [vidyaId, password]
      properties:
        vidyaId:
          type: string
        password:
          type: string

    ForgotPasswordInput:
      type: object
      required: [vidyaId, contact]
      properties:
        vidyaId:
          type: string
        contact:
          type: string

    UserProfile:
      type: object
      required: [vidyaId, name, role, gender, xp, badges]
      properties:
        vidyaId:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [student, parent]
        gender:
          type: string
          enum: [male, female]
        studentClass:
          type: ["string", "null"]
        board:
          type: ["string", "null"]
        parentType:
          type: ["string", "null"]
        contact:
          type: ["string", "null"]
        xp:
          type: integer
          default: 0
        badges:
          type: array
          items:
            type: string

    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        gender:
          type: string
          enum: [male, female]
        contact:
          type: ["string", "null"]

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ChatMessageInput:
      type: object
      required: [vidyaId, message]
      properties:
        vidyaId:
          type: string
        message:
          type: string
        sessionId:
          type: string
        language:
          type: string
          enum: [en, ta, hi, te]
        history:
          type: array
          items:
            $ref: "#/components/schemas/ChatHistoryItem"
        attachment:
          $ref: "#/components/schemas/ChatAttachment"

    ChatAttachment:
      type: object
      required: [name, mimeType, dataUrl]
      properties:
        name:
          type: string
        mimeType:
          type: string
        dataUrl:
          type: string
          description: Base64 data URL of the attached file (data:<mime>;base64,...)

    ChatHistoryItem:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    LinkStudentInput:
      type: object
      required: [studentVidyaId]
      properties:
        studentVidyaId:
          type: string

    LinkedStudentProfile:
      type: object
      required: [vidyaId, name, gender]
      properties:
        vidyaId:
          type: string
        name:
          type: string
        gender:
          type: string
          enum: [male, female]
        studentClass:
          type: ["string", "null"]
        board:
          type: ["string", "null"]

    LinkedStudentsResponse:
      type: object
      required: [students]
      properties:
        students:
          type: array
          items:
            $ref: "#/components/schemas/LinkedStudentProfile"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    TopicMastery:
      type: object
      required: [key, label, questionsPracticed, sessions, mastery]
      properties:
        key:
          type: string
        label:
          type: string
        questionsPracticed:
          type: integer
        sessions:
          type: integer
        mastery:
          type: integer
          description: Activity-based mastery estimate (0-100), derived from practice volume.

    StudentAnalytics:
      type: object
      required:
        [
          studentVidyaId,
          name,
          studentClass,
          board,
          totalSessions,
          totalMessages,
          topics,
        ]
      properties:
        studentVidyaId:
          type: string
        name:
          type: string
        studentClass:
          type: ["string", "null"]
        board:
          type: ["string", "null"]
        totalSessions:
          type: integer
        totalMessages:
          type: integer
        topics:
          type: array
          items:
            $ref: "#/components/schemas/TopicMastery"

    HistoryMessage:
      type: object
      required: [role, content, createdAt]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    HistorySession:
      type: object
      required: [sessionId, startedAt, messageCount, messages]
      properties:
        sessionId:
          type: string
        startedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
        messages:
          type: array
          items:
            $ref: "#/components/schemas/HistoryMessage"

    StudentHistoryResponse:
      type: object
      required: [studentVidyaId, name, sessions]
      properties:
        studentVidyaId:
          type: string
        name:
          type: string
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/HistorySession"

    ConsultantMessage:
      type: object
      required: [role, content, createdAt]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        attachmentName:
          type: ["string", "null"]
        attachmentType:
          type: ["string", "null"]

    ConsultantHistoryResponse:
      type: object
      required: [sessionId, messages]
      properties:
        sessionId:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConsultantMessage"

    ConsultantMessageInput:
      type: object
      properties:
        message:
          type: string
        sessionId:
          type: string
        studentVidyaId:
          type: ["string", "null"]
        language:
          type: string
          enum: [en, ta, hi, te]
        history:
          type: array
          items:
            $ref: "#/components/schemas/ChatHistoryItem"
        attachment:
          $ref: "#/components/schemas/ChatAttachment"

    ConsultantAudioInput:
      type: object
      required: [audio, mimeType]
      properties:
        audio:
          type: string
          description: Base64 data URL of recorded audio (data:<mime>;base64,...)
        mimeType:
          type: string
        language:
          type: string
          enum: [en, ta, hi, te]

    TranscriptionResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string
