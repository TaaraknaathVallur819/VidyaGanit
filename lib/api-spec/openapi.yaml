openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: chat
    description: Socratic math tutor chat
  - name: parent
    description: Parent dashboard analytics, history, and strategy AI
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Log in to an existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{vidyaId}:
    get:
      operationId: getProfile
      tags: [auth]
      summary: Get user profile
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update user profile
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{vidyaId}/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change user password
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{vidyaId}/linked-students:
    get:
      operationId: getLinkedStudents
      tags: [auth]
      summary: Get students linked to a parent
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Linked students list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedStudentsResponse"
        "404":
          description: Parent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{vidyaId}/analytics:
    get:
      operationId: getOwnAnalytics
      tags: [auth]
      summary: A student's own per-topic practice analytics
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAnalytics"
        "403":
          description: Cannot access another account's analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{vidyaId}/streak:
    get:
      operationId: getStreak
      tags: [auth]
      summary: A student's own practice-streak status and daily goal progress
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Streak status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakStatus"
        "403":
          description: Cannot access another account's streak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: setDailyGoal
      tags: [auth]
      summary: Update a student's own daily practice goal
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyGoalInput"
      responses:
        "200":
          description: Updated streak status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakStatus"
        "400":
          description: Invalid daily goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cannot modify another account's goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{vidyaId}/link-student:
    post:
      operationId: linkStudent
      tags: [auth]
      summary: Link a student to a parent account
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkStudentInput"
      responses:
        "200":
          description: Student linked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedStudentProfile"
        "400":
          description: Invalid input or already linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{vidyaId}/link-students:
    post:
      operationId: bulkLinkStudents
      tags: [auth]
      summary: Link multiple students to a parent or tutor account at once
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLinkStudentsInput"
      responses:
        "200":
          description: Per-ID linking results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkLinkResultsResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{vidyaId}/link-student/{studentVidyaId}:
    delete:
      operationId: unlinkStudent
      tags: [auth]
      summary: Unlink a student from a parent account
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
        - in: path
          name: studentVidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student unlinked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/message:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the Socratic math tutor (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: SSE stream of tutor response chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/score:
    post:
      operationId: submitGameScore
      tags: [chat]
      summary: Award XP for completing a mini-game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameScoreInput"
      responses:
        "200":
          description: Updated XP and badges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameScoreResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset link sent (mock)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: No matching account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset a password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parent/{vidyaId}/students/{studentVidyaId}/analytics:
    get:
      operationId: getStudentAnalytics
      tags: [parent]
      summary: Per-topic practice analytics for a linked student
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
        - in: path
          name: studentVidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAnalytics"
        "403":
          description: Student not linked to this parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parent/{vidyaId}/students/{studentVidyaId}/history:
    get:
      operationId: getStudentHistory
      tags: [parent]
      summary: Saved Socratic chat history for a linked student
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
        - in: path
          name: studentVidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student chat history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentHistoryResponse"
        "403":
          description: Student not linked to this parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parent/{vidyaId}/consultant/messages:
    get:
      operationId: getConsultantHistory
      tags: [parent]
      summary: Load the parent's saved strategy-AI conversation
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved consultant messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantHistoryResponse"

  /parent/{vidyaId}/consultant/sessions:
    get:
      operationId: listConsultantSessions
      tags: [parent]
      summary: List the parent's past strategy-AI conversations
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Past consultant sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantSessionsResponse"

  /parent/{vidyaId}/consultant/sessions/{sessionId}/messages:
    get:
      operationId: getConsultantSession
      tags: [parent]
      summary: Load a specific past strategy-AI conversation
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved consultant session messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantHistoryResponse"

  /parent/{vidyaId}/consultant/messages/{messageId}/feedback:
    post:
      operationId: setConsultantMessageFeedback
      tags: [parent]
      summary: Like / dislike (or clear) a strategy-AI assistant reply
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
        - in: path
          name: messageId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageFeedbackInput"
      responses:
        "200":
          description: Updated feedback state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageFeedbackResponse"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parent/{vidyaId}/consultant/message:
    post:
      operationId: sendConsultantMessage
      tags: [parent]
      summary: Ask the parent strategy AI (SSE stream)
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultantMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parent/{vidyaId}/consultant/transcribe:
    post:
      operationId: transcribeConsultantAudio
      tags: [parent]
      summary: Transcribe recorded parent audio to text
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultantAudioInput"
      responses:
        "200":
          description: Transcribed text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/{vidyaId}/sessions:
    get:
      operationId: listChatSessions
      tags: [chat]
      summary: List a student's past tutoring conversations
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Past tutoring sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionsResponse"

  /chat/{vidyaId}/sessions/{sessionId}/messages:
    get:
      operationId: getChatSession
      tags: [chat]
      summary: Load a specific past tutoring conversation
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved tutoring session messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionResponse"

  /chat/{vidyaId}/messages/{messageId}/feedback:
    post:
      operationId: setChatMessageFeedback
      tags: [chat]
      summary: Like / dislike (or clear) a tutor assistant reply
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
        - in: path
          name: messageId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageFeedbackInput"
      responses:
        "200":
          description: Updated feedback state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageFeedbackResponse"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessment/generate:
    post:
      operationId: generateAssessment
      tags: [assessment]
      summary: Generate a topic-mastery test (quiz/worksheet) for the student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateAssessmentInput"
      responses:
        "200":
          description: A freshly generated test (answer key withheld)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedAssessment"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessment/submit:
    post:
      operationId: submitAssessment
      tags: [assessment]
      summary: Submit answers for a generated test and get the score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAssessmentInput"
      responses:
        "200":
          description: Graded result (no negative marking)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Test not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessment/{vidyaId}/results:
    get:
      operationId: listOwnAssessments
      tags: [assessment]
      summary: List the student's own completed test results
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Completed test results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResultsResponse"

  /parent/{vidyaId}/students/{studentVidyaId}/assessments:
    get:
      operationId: getStudentAssessments
      tags: [parent]
      summary: Completed test results for a linked student
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
        - in: path
          name: studentVidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student test results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResultsResponse"
        "403":
          description: Student not linked to this parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parent/{vidyaId}/students/{studentVidyaId}/recommendation:
    get:
      operationId: getStudentRecommendation
      tags: [parent]
      summary: Recommended next lesson(s) for a linked student, based on progress
      parameters:
        - in: path
          name: vidyaId
          required: true
          schema:
            type: string
        - in: path
          name: studentVidyaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recommended next lessons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "403":
          description: Student not linked to this parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /curriculum/{studentClass}:
    get:
      operationId: getClassCurriculum
      tags: [curriculum]
      summary: Maths curriculum units for a class (4–7)
      parameters:
        - in: path
          name: studentClass
          required: true
          schema:
            type: string
            enum: ["4", "5", "6", "7"]
      responses:
        "200":
          description: Curriculum units for the class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumResponse"
        "400":
          description: Unknown class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated user is not a tutor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserRegistrationInput:
      type: object
      required: [name, password, role, gender]
      properties:
        name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [student, parent, tutor]
        gender:
          type: string
          enum: [male, female]
        studentClass:
          type: ["string", "null"]
          enum: ["4", "5", "6", "7", null]
        board:
          type: ["string", "null"]
        parentType:
          type: ["string", "null"]
          enum: [father, mother, null]
        contact:
          type: ["string", "null"]
        batch:
          type: ["string", "null"]
        batches:
          type: ["array", "null"]
          items:
            type: string
        academyName:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [vidyaId, password]
      properties:
        vidyaId:
          type: string
        password:
          type: string

    ForgotPasswordInput:
      type: object
      required: [vidyaId, contact]
      properties:
        vidyaId:
          type: string
        contact:
          type: string

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    UserProfile:
      type: object
      required: [vidyaId, name, role, gender, xp, badges]
      properties:
        vidyaId:
          type: string
        name:
          type: string
        role:
          type: string
