components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserRegistrationInput:
      type: object
      required: [name, password, role, gender]
      properties:
        name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [student, parent, tutor]
        gender:
          type: string
          enum: [male, female]
        studentClass:
          type: ["string", "null"]
          enum: ["4", "5", "6", "7", null]
        board:
          type: ["string", "null"]
        parentType:
          type: ["string", "null"]
          enum: [father, mother, null]
        contact:
          type: ["string", "null"]
        batch:
          type: ["string", "null"]
        batches:
          type: ["array", "null"]
          items:
            type: string
        academyName:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [vidyaId, password]
      properties:
        vidyaId:
          type: string
        password:
          type: string

    ForgotPasswordInput:
      type: object
      required: [vidyaId, contact]
      properties:
        vidyaId:
          type: string
        contact:
          type: string

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    UserProfile:
      type: object
      required: [vidyaId, name, role, gender, xp, badges]
      properties:
        vidyaId:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [student, parent, tutor]
        gender:
          type: string
          enum: [male, female]
        studentClass:
          type: ["string", "null"]
        board:
          type: ["string", "null"]
        parentType:
          type: ["string", "null"]
        contact:
          type: ["string", "null"]
        batch:
          type: ["string", "null"]
        batches:
          type: ["array", "null"]
          items:
            type: string
        academyName:
          type: ["string", "null"]
        aboutMe:
          type: ["string", "null"]
          maxLength: 1000
        language:
          type: ["string", "null"]
          enum: [en, hi, bn, mr, te, ta, gu, ur, kn, ml, pa, or, as, brx, doi, ks, kok, mai, mni, ne, sa, sat, sd, null]
        voiceRate:
          type: number
          minimum: 0.5
          maximum: 2
          default: 1
        voicePitch:
          type: number
          minimum: 0
          maximum: 2
          default: 1
        voiceName:
          type: ["string", "null"]
        xp:
          type: integer
          default: 0
        badges:
          type: array
          items:
            type: string

    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        gender:
          type: string
          enum: [male, female]
        contact:
          type: ["string", "null"]
        aboutMe:
          type: ["string", "null"]
          maxLength: 1000
        language:
          type: string
          enum: [en, hi, bn, mr, te, ta, gu, ur, kn, ml, pa, or, as, brx, doi, ks, kok, mai, mni, ne, sa, sat, sd]
        voiceRate:
          type: number
          minimum: 0.5
          maximum: 2
        voicePitch:
          type: number
          minimum: 0
          maximum: 2
        voiceName:
          type: ["string", "null"]

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ChatMessageInput:
      type: object
      required: [vidyaId, message]
      properties:
        vidyaId:
          type: string
        message:
          type: string
        sessionId:
          type: string
        language:
          type: string
          enum: [en, hi, bn, mr, te, ta, gu, ur, kn, ml, pa, or, as, brx, doi, ks, kok, mai, mni, ne, sa, sat, sd]
        history:
          type: array
          items:
            $ref: "#/components/schemas/ChatHistoryItem"
        attachment:
          $ref: "#/components/schemas/ChatAttachment"
        chatModel:
          type: string
          enum:
            [
              gpt-5.4,
              gpt-5-mini,
              gpt-5-nano,
              claude-opus-4-8,
              claude-sonnet-4-6,
              claude-haiku-4-5,
              gemini-3-pro,
              gemini-3-flash,
              gemini-2.5-flash,
              perplexity-sonar,
              perplexity-sonar-pro,
              perplexity-sonar-reasoning,
              deepseek-chat-v3,
              deepseek-r1,
            ]
        imageModel:
          type: string
          enum: [openai, gemini-nano-banana, gemini-nano-banana-pro]

    ChatAttachment:
      type: object
      required: [name, mimeType, dataUrl]
      properties:
        name:
          type: string
        mimeType:
          type: string
        dataUrl:
          type: string
          description: Base64 data URL of the attached file (data:<mime>;base64,...)

    ChatHistoryItem:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    LinkStudentInput:
      type: object
      required: [studentVidyaId]
      properties:
        studentVidyaId:
          type: string
        batch:
          type: ["string", "null"]

    LinkedStudentProfile:
      type: object
      required: [vidyaId, name, gender]
      properties:
        vidyaId:
          type: string
        name:
          type: string
        gender:
          type: string
          enum: [male, female]
        studentClass:
          type: ["string", "null"]
        board:
          type: ["string", "null"]
        batch:
          type: ["string", "null"]

    LinkedStudentsResponse:
      type: object
      required: [students]
      properties:
        students:
          type: array
          items:
            $ref: "#/components/schemas/LinkedStudentProfile"

    BulkLinkStudentsInput:
      type: object
      required: [studentVidyaIds]
      properties:
        studentVidyaIds:
          type: array
          items:
            type: string
        batch:
          type: ["string", "null"]

    BulkLinkResult:
      type: object
      required: [vidyaId, status]
      properties:
        vidyaId:
          type: string
        status:
          type: string
          enum: [linked, already_linked, not_found, not_a_student, self]
        name:
          type: ["string", "null"]

    BulkLinkResultsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/BulkLinkResult"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    TopicMastery:
      type: object
      required: [key, label, questionsPracticed, sessions, mastery]
      properties:
        key:
          type: string
        label:
          type: string
        questionsPracticed:
          type: integer
        sessions:
          type: integer
        mastery:
          type: integer
          description: Activity-based mastery estimate (0-100), derived from practice volume.

    StudentAnalytics:
      type: object
      required:
        [
          studentVidyaId,
          name,
          studentClass,
          board,
          totalSessions,
          totalMessages,
          topics,
        ]
      properties:
        studentVidyaId:
          type: string
        name:
          type: string
        studentClass:
          type: ["string", "null"]
        board:
          type: ["string", "null"]
        totalSessions:
          type: integer
        totalMessages:
          type: integer
        topics:
          type: array
          items:
            $ref: "#/components/schemas/TopicMastery"

    StreakStatus:
      type: object
      required:
        [streakCurrent, streakLongest, dailyGoal, todayCount, lastActiveDate]
      properties:
        streakCurrent:
          type: integer
        streakLongest:
          type: integer
        dailyGoal:
          type: integer
        todayCount:
          type: integer
        lastActiveDate:
          type: ["string", "null"]

    DailyGoalInput:
      type: object
      required: [dailyGoal]
      properties:
        dailyGoal:
          type: integer
          minimum: 1
          maximum: 50

    HistoryMessage:
      type: object
      required: [role, content, createdAt]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    HistorySession:
      type: object
      required: [sessionId, startedAt, messageCount, messages]
      properties:
        sessionId:
          type: string
        startedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
        messages:
          type: array
          items:
            $ref: "#/components/schemas/HistoryMessage"

    StudentHistoryResponse:
      type: object
      required: [studentVidyaId, name, sessions]
      properties:
        studentVidyaId:
          type: string
        name:
          type: string
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/HistorySession"

    ConsultantMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id:
          type: integer
