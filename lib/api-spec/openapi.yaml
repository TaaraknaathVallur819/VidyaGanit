openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Log in to an existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset link sent (mock)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: No matching account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserRegistrationInput:
      type: object
      required: [name, password, role, gender]
      properties:
        name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [student, parent]
        gender:
          type: string
          enum: [male, female]
        studentClass:
          type: ["string", "null"]
          enum: ["4", "5", "6", "7", null]
        board:
          type: ["string", "null"]
        parentType:
          type: ["string", "null"]
          enum: [father, mother, null]
        contact:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [vidyaId, password]
      properties:
        vidyaId:
          type: string
        password:
          type: string

    ForgotPasswordInput:
      type: object
      required: [vidyaId, contact]
      properties:
        vidyaId:
          type: string
        contact:
          type: string

    UserProfile:
      type: object
      required: [vidyaId, name, role, gender]
      properties:
        vidyaId:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [student, parent]
        gender:
          type: string
          enum: [male, female]
        studentClass:
          type: ["string", "null"]
        board:
          type: ["string", "null"]
        parentType:
          type: ["string", "null"]
        contact:
          type: ["string", "null"]

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
